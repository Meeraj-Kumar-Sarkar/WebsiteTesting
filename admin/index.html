<!doctype html>
<html lang="en" data-accent="forest">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23344e41' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m8 3 4 8 5-5 5 15H2L8 3z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <title>Mountain &amp; Memories — Admin Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
    <script>
      // Apply saved UI preferences before first paint to avoid a theme flash.
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('mm_prefs') || '{}');
          var root = document.documentElement;
          var theme = p.theme || 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
          root.setAttribute('data-accent', p.accent || 'forest');
          root.setAttribute('data-density', p.density || 'comfortable');
          var scale = { sm: '14.5px', md: '16px', lg: '17px' }[p.fontScale || 'md'];
          root.style.setProperty('--ui-scale', scale);
          var fonts = { inter: 'Inter', manrope: 'Manrope', system: 'system-ui' };
          root.style.setProperty('--font-sans', fonts[p.font || 'inter']);
          if (p.reduceMotion) root.setAttribute('data-motion', 'reduced');
        } catch (e) { /* ignore corrupted prefs */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
